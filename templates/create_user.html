{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="header">
        <h1>Create Employee Account</h1>
    </div>

    <div class="card">

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-grid">

                <div class="form-group">
                    <label>Username</label>

                    <input
                        type="text"
                        name="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        required
                    >
                </div>

                <div class="form-group">

                    <label>Role</label>

                    <select name="role">

                        <option value="employee">
                            Employee
                        </option>

                        <option value="admin">
                            Admin
                        </option>

                    </select>

                </div>

            </div>

            <div class="button-container">

                <button type="submit">
                    Create User
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>

{% endblock %}
