{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="header">
        <h1>Edit Ingredient</h1>
    </div>


    <div class="card">

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-grid">

                <div class="form-group">
                    <label>Ingredient Name</label>

                    <input
                        type="text"
                        name="ingredient_name"
                        value="{{ ingredient.ingredient_name }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Category</label>

                    <input
                        type="text"
                        name="category"
                        value="{{ ingredient.category }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Quantity</label>

                    <input
                        type="number"
                        step="0.01"
                        name="quantity"
                        value="{{ ingredient.quantity }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Price</label>

                    <input
                        type="number"
                        step="0.01"
                        name="price"
                        value="{{ ingredient.price }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Purchase Date</label>

                    <input
                        type="date"
                        name="purchase_date"
                        value="{{ ingredient.purchase_date }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Supplier</label>

                    <input
                        type="text"
                        name="supplier"
                        value="{{ ingredient.supplier }}"
                    >
                    <input
                        type="date"
                        name="expiry_date"
                        value="{{ ingredient.expiry_date }}"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Used?</label>

                    <select name="used">

                        <option
                            value="Yes"
                            {% if ingredient.used == 'Yes' %}
                                selected
                            {% endif %}
                        >
                            Yes
                        </option>

                        <option
                            value="No"
                            {% if ingredient.used == 'No' %}
                                selected
                            {% endif %}
                        >
                            No
                        </option>

                    </select>

                </div>

            </div>

            <div class="button-container">
                <button type="submit">
                    Update Record
                </button>
            </div>

        </form>

    </div>

</div>

</body>
</html>

{% endblock %}
